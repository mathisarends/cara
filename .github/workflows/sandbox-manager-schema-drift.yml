name: Sandbox Manager schema drift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-artifacts:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Regenerate Sandbox Manager schema
        run: uv run --frozen --package sandbox-manager cara-sandbox-manager-schema

      - name: Regenerate Python client
        run: >-
          uv run --frozen httpxgen
          sandbox_manager/schema/openapi.json
          generated/sandbox_manager_client/src/sandbox_manager_client
          --package-name sandbox_manager_client
          --client-name SandboxManagerClient
          --http-client httpx2

      - name: Format and lint the regenerated client
        run: |
          uv run --frozen ruff format generated/sandbox_manager_client/src
          uv run --frozen ruff check --fix generated/sandbox_manager_client/src

      - name: Check generated artifacts for drift
        run: |
          paths="sandbox_manager/schema generated/sandbox_manager_client/src"
          drift="$(git status --porcelain -- ${paths})"
          if [ -n "${drift}" ]; then
            echo "${drift}"
            git diff -- ${paths}
            echo "::error::Sandbox Manager schema or client is stale. Run scripts/codegen/generate_sandbox_manager_client.sh and commit the result."
            exit 1
          fi
