name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run Gateway tests
        run: uv run --frozen --package gateway-server pytest gateway/tests -q

  gateway-rpc-client:
    name: Gateway RPC client tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run Gateway RPC client tests
        run: >-
          uv run --frozen --package gateway-rpc-client
          pytest generated/gateway_rpc_client/tests -q

  voice:
    name: Voice tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run Voice tests
        run: uv run --frozen --package voice pytest clients/voice/tests -q
