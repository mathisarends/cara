name: Gateway schema drift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-artifacts:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"
      GENERATED_PATHS: >-
        gateway/schema
        generated/gateway_rest_client/src
        generated/gateway_rpc_client/src

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Regenerate schemas and clients
        run: ./scripts/codegen/generate_gateway_clients.sh

      - name: Check generated artifacts for drift
        run: |
          drift="$(git status --porcelain -- ${GENERATED_PATHS})"
          if [ -n "${drift}" ]; then
            echo "${drift}"
            git diff -- ${GENERATED_PATHS}
            echo "::error::Gateway schemas or clients are stale. Run scripts/codegen/generate_gateway_clients.sh and commit the result."
            exit 1
          fi
