name: Gateway schema drift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-artifacts:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Regenerate Gateway schema
        run: uv run --frozen --package gateway-server cara-gateway-schema

      - name: Regenerate Python client
        run: >-
          uv run --frozen --package gateway-codegen cara-gateway-client-generate
          gateway/schema/gateway.openrpc.json

      - name: Check generated artifacts for drift
        run: >-
          git diff --exit-code --
          gateway/schema/gateway.schema.json
          gateway/schema/gateway.openrpc.json
          generated/gateway_client/src/gateway_client
