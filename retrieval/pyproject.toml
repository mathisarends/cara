[project]
name = "retrieval"
version = "0.1.0"
description = "Provider-agnostic indexing and retrieval."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
openai = [
    "openai>=1.100.0",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
