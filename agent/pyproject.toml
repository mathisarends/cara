[project]
name = "agent"
version = "0.1.0"
description = "Agentic core: agent loop, tools, memory, and prompt assembly."
requires-python = ">=3.13,<3.14"
dependencies = [
    "llm",
    "mm-agenttoolkit>=0.4.0",
    "pydantic>=2.7.0",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
extend = "../pyproject.toml"
