[project]
name = "agent"
version = "0.1.0"
description = "Agentic core: agent loop, tools, memory, and prompt assembly."
requires-python = ">=3.13,<3.14"
dependencies = [
    "llm",
    "httpx>=0.28.0",
    "mm-agenttoolkit>=0.2.0",
    "openai>=1.100.0",
    "py-llmify[openai]>=0.10.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "retrieval",
    "tavily-python>=0.7.26",
    "tzdata>=2024.1",
    "voice",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
extend = "../pyproject.toml"
