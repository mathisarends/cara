name: cara

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command:
      - sh
      - -c
      - .venv/bin/gateway-migrate && exec .venv/bin/python -m gateway.main
    environment:
      CARA_GATEWAY_HOST: 0.0.0.0
      CARA_GATEWAY_TOKEN: ${CARA_GATEWAY_TOKEN:-change-me-gateway-token-32-characters}
      CARA_WORKSPACE_ROOT: /workspace
      CARA_SANDBOX: '{"url":"http://sandbox-manager:8080","token":"${CARA_SANDBOX_TOKEN:-change-me}","workspace_id":"default"}'
    ports:
      - "8000:8000"
    volumes:
      - cara-workspace:/workspace:ro
      # The model client runs here and reads /root/.codex/auth.json.
      # Override CARA_CODEX_HOME for a non-standard host location.
      - ${CARA_CODEX_HOME:-${HOME}/.codex}:/root/.codex:ro
      - ./gateway.yaml:/app/gateway.yaml:ro
      - ./gateway.sqlite3:/app/gateway.sqlite3
    depends_on:
      sandbox-manager:
        condition: service_healthy

  sandbox-manager:
    build:
      context: .
      dockerfile: sandbox_manager/Dockerfile
    environment:
      CARA_SANDBOX_TOKEN: ${CARA_SANDBOX_TOKEN:-change-me}
      CARA_SANDBOX_WORKSPACE_VOLUME: cara-workspace
      CARA_SANDBOX_CLI_CONFIG_VOLUME: cara-cli-config
      # CLI name -> host config dir, bind-mounted read-write into the sandbox
      # at /tmp/.config/<name>, so e.g. `spoti auth setup` writes back here directly.
      CARA_SANDBOX_CLI_CREDENTIAL_MOUNTS: spoti=${APPDATA}/spoti;huego=${APPDATA}/huego
      CARA_SANDBOX_IDLE_TTL_SECONDS: ${CARA_SANDBOX_IDLE_TTL_SECONDS:-600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cara-workspace:/workspace
      - cara-cli-config:/tmp/.config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/readiness')"]
      interval: 5s
      timeout: 2s
      retries: 12

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    command: ["gateway.sqlite3"]
    ports:
      - "8080:8080"
    volumes:
      - ./gateway.sqlite3:/data/gateway.sqlite3

  minio:
    # Last release that ships the full web console; later community builds strip it down.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CARA_MINIO_ROOT_USER:-cara}
      MINIO_ROOT_PASSWORD: ${CARA_MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cara-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 2s
      retries: 12

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set cara http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "cara/$$CARA_MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${CARA_MINIO_ROOT_USER:-cara}
      MINIO_ROOT_PASSWORD: ${CARA_MINIO_ROOT_PASSWORD:-change-me-minio-password}
      CARA_MINIO_BUCKET: ${CARA_MINIO_BUCKET:-cara}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  cara-workspace:
    name: cara-workspace
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CARA_WORKSPACE_ROOT:-${HOME}/.cara/workspace}
  cara-cli-config:
    name: cara-cli-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CARA_SANDBOX_CLI_CONFIG_ROOT:-${HOME}/.cara/cli-config}
  cara-minio-data:
    name: cara-minio-data
