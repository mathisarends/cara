name: cara

# Optional, for running the gateway in isolation. `scripts/start_gateway.sh` is the
# supported way to run it: the agent's `bash` tool sandboxes commands in a sibling
# Docker container, which it cannot reach from in here, so turns that shell out fail.
#
# Note: a service that sets `volumes` replaces this list rather than extending it,
# so each service below spells out every mount it needs.
x-gateway: &gateway
  build:
    context: .
    dockerfile: docker/gateway.Dockerfile
  environment:
    DATABASE_URL: sqlite+aiosqlite:////app/data/gateway.sqlite3
  env_file:
    - path: .env
      required: false

services:
  # Runs to completion before the gateway starts. Alembic brings up its own event
  # loop, so it must never share a process with the server.
  migrate:
    <<: *gateway
    command: ["gateway-migrate"]
    volumes:
      - gateway-data:/app/data

  gateway:
    <<: *gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - gateway-data:/app/data
      # The agent authenticates with the host's Codex CLI credentials instead of
      # requiring a `codex login` of its own inside the container.
      - ~/.codex:/root/.codex:ro
      # `cara onboard` creates the persistent workspace on the host.
      - ~/.cara:/root/.cara

volumes:
  gateway-data:
