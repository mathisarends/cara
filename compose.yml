name: cara

# The gateway runs on the host via `scripts/start_gateway.sh`. Docker is only
# used here for the optional SQLite browser.
services:
  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    command: ["gateway.sqlite3"]
    ports:
      - "8080:8080"
    volumes:
      - ./gateway.sqlite3:/data/gateway.sqlite3
