[project]
name = "sandbox-manager"
version = "0.1.0"
description = "Workspace-scoped Docker sandbox control plane for Cara."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dishka>=1.10.0",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "fastapi-canon>=0.4.0,<0.5.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
cara-sandbox-manager = "sandbox_manager.main:main"
cara-sandbox-manager-schema = "sandbox_manager.schema_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_manager"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
