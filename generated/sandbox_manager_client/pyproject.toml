[project]
name = "sandbox-manager-client"
version = "0.1.0"
description = "Generated, fully typed Python client for the Cara Sandbox Manager."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx2>=2.9.1",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_manager_client"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.coverage.run]
omit = [
    "*/sandbox_manager_client/*",
]
