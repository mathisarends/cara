[project]
name = "room-client"
version = "0.1.0"
description = "Cara room runtime and Gateway presence client."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dishka>=1.10.0",
    "fastapi>=0.115.0",
    "fastapi-canon>=0.4.0,<0.5.0",
    "gateway-rest-client",
    "gateway-rpc-client",
    "httpx2>=2.9.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
cara-room = "room.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/room"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
extend = "../pyproject.toml"
