[project]
name = "gateway"
version = "0.1.0"
description = "JSON-RPC WebSocket gateway for Cara clients."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.0",
    "alembic>=1.19.1",
    "agent-plugin-api",
    "dishka>=1.4.0",
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "scheduler",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.30.0",
    # Uvicorn only serves the WebSocket API when a WS implementation is present.
    "websockets>=13.0",
    "pyrpckit==0.2.0",
]

[project.scripts]
cara-gateway = "gateway.main:main"
cara-gateway-schema = "gateway.presentation.rpc.schema_export:main"
gateway-migrate = "gateway.infrastructure.database.migrations:main"

[project.entry-points."cara.agent_plugins"]
echo = "gateway.features.conversation.infrastructure.echo_agent:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
