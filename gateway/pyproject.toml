[project]
name = "gateway"
version = "0.1.0"
description = "HTTP gateway exposing Cara's capabilities as API routes."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dishka>=1.4.0",
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "scheduler",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
scheduler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.ruff]
extend = "../pyproject.toml"
