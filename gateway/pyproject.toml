[project]
name = "gateway-server"
version = "0.1.0"
description = "REST and JSON-RPC WebSocket gateway for Cara clients."
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent",
    "aiosqlite>=0.22.0",
    "alembic>=1.19.1",
    "dishka>=1.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "httpx2>=2.9.1",
    "fastapi-canon==0.6.0",
    "obstore>=0.11.1",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "sandbox-manager-client",
    "scheduler",
    "sqlmodel>=0.0.31",
    "stt",
    "tts",
    "tzdata>=2024.1",
    "uvicorn>=0.30.0",
    # Uvicorn only serves the WebSocket API when a WS implementation is present.
    "websockets>=13.0",
    "fastapi-rpckit[dishka]==0.4.0",
    "mcp>=2.2,<3",
    "lameenc>=1.8.4",
]

[project.scripts]
cara-gateway = "gateway.main:main"
cara-gateway-schema = "gateway.presentation.schema_export:main"
cara-gateway-rpc-client-generate = "gateway.rpc.client_codegen:main"
gateway-migrate = "gateway.platform.database.migrations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "fastapi-rpckit[codegen]==0.4.0",
    "ruff>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
