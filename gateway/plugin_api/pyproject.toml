[project]
name = "agent-plugin-api"
version = "0.1.0"
description = "Stable agent plugin contracts for the Cara Gateway."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_plugin_api"]

[tool.ruff]
extend = "../../pyproject.toml"
