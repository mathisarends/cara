[project]
name = "gateway-codegen"
version = "0.1.0"
description = "Code generator for the typed Cara Gateway Python client."
requires-python = ">=3.13,<3.14"
dependencies = [
    "jinja2>=3.1.0",
    "pyrpckit==0.2.0",
    "ruff>=0.14.0",
]

[project.scripts]
cara-gateway-client-generate = "gateway_codegen.codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_codegen"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
