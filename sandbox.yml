image: cara-bash-sandbox:latest
shell: /bin/bash

workspace:
  root: .
  max_file_bytes: null

defaults:
  home: /tmp
  timeout_seconds: 15
  max_output_bytes: 1_000_000

limits:
  memory_bytes: 268435456 # 256 * 1024 * 1024
  pids: 64
  cpus: 1

network_access: true

mounts:
  cli_credentials:
    - name: huego
      target: /tmp/.config/huego
    - name: spoti
      target: /tmp/.config/spoti
    - name: withings-client
      target: /tmp/.config/withings-client
    - name: sonoscli
      target: /tmp/.config/sonoscli
    - name: fitbitctl
      target: /tmp/.config/fitbitctl

reserved_targets:
  - /workspace
