# Local development, applied automatically by `docker compose up -d`.
# Sources are bind-mounted over the image so uvicorn reloads on edit, in any
# workspace package the server imports — not just `gateway`.
# Run the image as built with `docker compose -f compose.yml up -d`.

x-sources: &sources
  - ./gateway/src:/app/gateway/src:ro
  - ./gateway/migrations:/app/gateway/migrations:ro
  - ./agent/src:/app/agent/src:ro
  - ./llm/src:/app/llm/src:ro
  - ./scheduler/src:/app/scheduler/src:ro

services:
  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    command: ["gateway.sqlite3"]
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data

  migrate:
    volumes: *sources

  gateway:
    command:
      - uvicorn
      - gateway.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/gateway/src
      - --reload-dir=/app/agent/src
      - --reload-dir=/app/llm/src
      - --reload-dir=/app/scheduler/src
    volumes: *sources
