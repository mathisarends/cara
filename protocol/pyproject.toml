[project]
name = "agent-protocol"
version = "0.1.0"
description = "Canonical wire contracts and client for the Cara gateway."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7.0",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_protocol"]

[tool.ruff]
extend = "../pyproject.toml"
