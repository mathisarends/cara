[project]
name = "cara"
version = "0.1.0"
description = "Input-agnostic conversational agent with terminal and voice sessions."
requires-python = ">=3.13,<3.14"
dependencies = [
    "llm",
    "retrieval[openai,sqlite]",
    "httpx>=0.28.0",
    "hueify>=0.8.1",
    "mm-agenttoolkit>=0.2.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.24.3",
    "openai>=1.100.0",
    "py-llmify[openai]>=0.10.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sonosify>=0.4.1",
    "spotifyify>=0.7.0",
    "tavily-python>=0.7.26",
    "transitbus>=0.1.0",
    "tzdata>=2024.1",
    "vocalbin>=0.3.0",
    "wakewordkit>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cara"]

[tool.ruff]
extend = "../pyproject.toml"
