# Single source of truth for the Gateway-owned agent runtime.
agent:
  # Local timezone used for current-time lookups and daily memory selection.
  timezone: Europe/Berlin

  # Default model and models available for runtime switching.
  models:
    default: gpt-5.6-luna
    available:
      - gpt-5.6-luna
      - gpt-5.6-terra
      - gpt-5.6-sol


# Directory the Gateway exposes to the agent through the Sandbox Manager.
workspace:
  root: ~/.cara/workspace

sandbox:
  url: http://127.0.0.1:8081
  token: change-me
  workspace_id: default

# Sandbox Manager policy. Compose only supplies its internal service URL and
# mounts; user-facing sandbox behavior belongs here.
sandbox_manager:
  image: cara-bash-sandbox:latest
  workspace_root: /workspace
  workspace_volume: cara-workspace
  cli_config_volume: cara-cli-config
  # Host CLI credentials are mounted read-write at /tmp/.config/<name>.
  cli_credential_mounts:
    spoti: ${APPDATA}/spoti
    huego: ${APPDATA}/huego
  idle_ttl_seconds: 600
  reap_interval_seconds: 10
  memory_bytes: 536870912
  pids: 512
  cpus: 1
  network_access: true
  max_output_bytes: 1000000

# User and integration tools run out of process. Tool names are exposed as
# <server-name>_<tool-name>. Example:
# tools:
#   - name: github
#     url: http://github-tools:8080/mcp
#     token: replace-me
tools: []
