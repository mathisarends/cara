[project]
name = "openclaw-client"
version = "0.1.0"
description = "Minimal async client for the OpenClaw gateway WebSocket protocol."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7.0",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_client"]

[tool.ruff]
extend = "../pyproject.toml"
