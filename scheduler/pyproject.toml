[project]
name = "scheduler"
version = "0.1.0"
description = "Job scheduling and persistence, independent of Cara and the gateway."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.ruff]
extend = "../pyproject.toml"
