[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.workspace]
members = ["agent", "config", "gateway", "gateway_client", "llm", "voice"]

[tool.uv.sources]
agent = { workspace = true }
config = { workspace = true }
gateway = { workspace = true }
gateway-client = { workspace = true }
llm = { workspace = true }
voice = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "experiments",
    "gateway",
    "gateway_client",
    "llm",
    "voice",
]
