[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.0",
]
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.workspace]
members = [
    "agent",
    "clients/cli",
    "clients/voice",
    "gateway/server",
    "gateway/plugin_api",
    "gateway/client",
    "gateway/codegen",
    "libs/llm",
    "libs/retrieval",
    "libs/scheduler",
    "memory",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
agent = { workspace = true }
cli = { workspace = true }
gateway-server = { workspace = true }
agent-plugin-api = { workspace = true }
gateway-client = { workspace = true }
gateway-codegen = { workspace = true }
llm = { workspace = true }
memory = { workspace = true }
retrieval = { workspace = true }
scheduler = { workspace = true }
voice = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "cli",
    "experiments",
    "gateway",
    "agent_plugin_api",
    "gateway_client",
    "gateway_codegen",
    "llm",
    "memory",
    "retrieval",
    "scheduler",
    "voice",
]
