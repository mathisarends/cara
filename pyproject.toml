[dependency-groups]
dev = [
    "httpxgen>=0.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.0",
]
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.workspace]
members = [
    "agent",
    "cara-tools",
    "cli",
    "clients/voice",
    "gateway",
    "generated/gateway_rest_client",
    "generated/gateway_rpc_client",
    "generated/sandbox_manager_client",
    "libs/llm",
    "libs/scheduler",
    "libs/stt",
    "libs/tts",
    "memory",
    "room",
    "sandbox_manager",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
agent = { workspace = true }
cara-tools = { workspace = true }
cli = { workspace = true }
room-client = { workspace = true }
gateway-server = { workspace = true }
gateway-rest-client = { workspace = true }
gateway-rpc-client = { workspace = true }
llm = { workspace = true }
memory = { workspace = true }
scheduler = { workspace = true }
sandbox-manager = { workspace = true }
sandbox-manager-client = { workspace = true }
stt = { workspace = true }
tts = { workspace = true }
voice = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Generated clients re-export names their own module never calls (F401) and
# httpxgen's OpenAPI error model can shadow pydantic's ValidationError (F811).
"generated/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "cara_tools",
    "cli",
    "experiments",
    "gateway",
    "gateway_rest_client",
    "gateway_rpc_client",
    "llm",
    "memory",
    "sandbox_manager_client",
    "scheduler",
    "stt",
    "tts",
    "voice",
]
