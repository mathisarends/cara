[project]
name = "gateway-client"
version = "0.1.0"
description = "Generated, fully typed Python client for the Cara Gateway."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7.0",
    "websockets>=13.0",
]

[project.scripts]
cara-gateway-client-generate = "gateway_client.codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_client"]

[tool.ruff]
extend = "../pyproject.toml"
