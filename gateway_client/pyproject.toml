[project]
name = "gateway-client"
version = "0.1.0"
description = "Typed async client for the Cara Gateway HTTP and WebSocket API."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_client"]

[tool.ruff]
extend = "../pyproject.toml"
