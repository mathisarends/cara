[project]
name = "rpckit"
version = "0.1.0"
description = "Decorator-driven, transport-agnostic JSON-RPC 2.0 protocols for Python."
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.7"]

[project.scripts]
rpckit = "rpckit.codegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rpckit"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["rpckit"]
