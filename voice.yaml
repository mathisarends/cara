# Connection settings for the voice channel.
# Every value can be overridden by an env var, e.g. CARA_GATEWAY_URL.
# The gateway token is a secret and stays in .env (CARA_GATEWAY_TOKEN).
gateway:
  # Gateway base URL: REST lives here, the socket at /v1/gateway (ws/wss).
  url: http://127.0.0.1:8000

voice:
  channel: voice
  # Stable identity used to resume this device's open voice session.
  device_id: default-voice-device
  new_session: false
  # Start fresh after 30 minutes without persisted conversation activity.
  inactivity_timeout_seconds: 1800
