[project]
name = "cara-tools"
version = "0.1.0"
description = "Out-of-process MCP tools for Cara."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=2.2,<3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "starlette>=0.40.0",
    "tavily-python>=0.7.26",
]

[project.scripts]
cara-tools = "cara_tools.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cara_tools"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
