[project]
name = "voice"
version = "0.1.0"
description = "Voice modality: audio I/O, wake word detection, and speech sessions."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cara",
    "mm-agenttoolkit>=0.2.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.24.3",
    "pyaudio>=0.2.14",
    "pydantic>=2.7.0",
    "sonosify>=0.4.1",
    "transitbus>=0.1.0",
    "vocalbin>=0.3.0",
    "wakewordkit>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.ruff]
extend = "../pyproject.toml"
