[project]
name = "stt"
version = "0.1.0"
description = "Streaming speech-to-text adapters, independent of Cara."
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepgram-sdk>=5,<6",
    "httpx2>=2.9.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
