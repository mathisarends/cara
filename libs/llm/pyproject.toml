[project]
name = "llm"
version = "0.1.0"
description = "LLM client configuration and credentials, independent of Cara."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "py-llmify[openai,websocket]>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.ruff]
extend = "../../pyproject.toml"
