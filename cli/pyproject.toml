[project]
name = "cara-cli"
version = "0.1.0"
description = "Command-line interface for setting up and operating Cara."
requires-python = ">=3.13,<3.14"
dependencies = [
    "psutil>=7.0.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.scripts]
cara = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.ruff]
extend = "../pyproject.toml"
