[project]
name = "cli"
version = "0.1.0"
description = "Interactive console client for manual Cara Gateway testing."
requires-python = ">=3.13,<3.14"
dependencies = [
    "gateway-client",
    "pyrpckit==0.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cara-chat = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.uv.sources]
gateway-client = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"
