[project]
name = "config"
version = "0.1.0"
description = "Shared environment-backed configuration for Cara applications."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config"]

[tool.ruff]
extend = "../pyproject.toml"
